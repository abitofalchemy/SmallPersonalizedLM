# Small model for smoke tests and debugging (~30M params, mostly embeddings).
model:
  vocab_size: 50257
  context_length: 256
  emb_dim: 256
  n_heads: 4
  n_layers: 4
  drop_rate: 0.1
  qkv_bias: false

train:
  data_dir: data/processed
  out_dir: checkpoints/tiny
  batch_size: 16
  num_epochs: 5
  learning_rate: 5.0e-4
  weight_decay: 0.1
  eval_freq: 50
  eval_iters: 10
  seed: 123
